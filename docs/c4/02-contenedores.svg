>&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.4087" x="1009.8516" y="157.1606">Cat&#225;logo consume capacidades de lectura</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.1118" x="1006.5" y="172.2935">de Publicaciones y no accede directamente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.1816" x="1058.4651" y="187.4263">a repository.py ni a MySQL.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="44" id="ent0018"><path d="M1926,401.2969 L1926,463.3615 L1862.7462,464.7122 L1926,471.3615 L1926,547.4922 A0,0 0 0 0 1926,547.4922 L2258.7334,547.4922 A0,0 0 0 0 2258.7334,547.4922 L2258.7334,411.2969 L2248.7334,401.2969 L1926,401.2969 A0,0 0 0 0 1926,401.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2248.7334,401.2969 L2248.7334,411.2969 L2258.7334,411.2969 L2248.7334,401.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="193.959" x="1990.8872" y="418.3638">ALCANCE DEL FILESYSTEM</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="2085.8005" y="433.4966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.8525" x="1974.4404" y="448.6294">Desarrollo: directorio configurable.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.7598" x="1953.4868" y="463.7622">Compose: volumen nombrado verificado.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.5313" x="1940.6011" y="478.895">El volumen no es un respaldo independiente.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.4634" x="1938.135" y="494.0278">ADR-0011, ADR-0015, ADR-0018 y ADR-0025.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.1035" x="1955.3149" y="509.1606">Flutter Web se sirve desde api por /app/.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.375" x="1978.1792" y="524.2935">Frontend l&#243;gico y archivos no son</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.7334" x="1932" y="539.4263">contenedores Docker adicionales: solo api y db.</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="56" id="ent0021"><path d="M1917,207.2969 L1917,298.6196 L1880.1453,304.1525 L1917,306.6196 L1917,383.7578 A0,0 0 0 0 1917,383.7578 L2267.6274,383.7578 A0,0 0 0 0 2267.6274,383.7578 L2267.6274,217.2969 L2257.6274,207.2969 L1917,207.2969 A0,0 0 0 0 1917,207.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2257.6274,207.2969 L2257.6274,217.2969 L2267.6274,217.2969 L2257.6274,207.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="164.3345" x="2005.6465" y="224.3638">PROPIEDAD DE DATOS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="2085.7476" y="239.4966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.5981" x="1973.5146" y="254.6294">Gesti&#243;n de Publicaciones mantiene</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.6836" x="1992.4719" y="269.7622">la escritura de publicaciones,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.6274" x="1923" y="284.895">publicacion_imagenes y solicitudes_idempotentes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="2085.7476" y="300.0278">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.2715" x="1954.678" y="315.1606">Usuarios, Administraci&#243;n, Universidades,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.0513" x="1984.7881" y="330.2935">Favoritos y Mensajer&#237;a escriben</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.436" x="1966.5957" y="345.4263">sus tablas mediante sus repositories.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.4258" x="1978.1008" y="360.5591">Cat&#225;logo no tiene repository SQL.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.3794" x="1993.624" y="375.6919">Conexi&#243;n compartida: db.py.</text></g><!--entity frontend--><g class="entity" data-qualified-name="CampusMarket.frontend" data-source-line="15" id="ent0005"><rect fill="#F1F1F1" height="134.0781" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="299.0977" x="398" y="243.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.1094" x="515.9941" y="266.292">Frontend</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="545.3237" y="282.5889">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.3848" x="502.3564" y="298.8857">Flutter / Dart</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="545.3237" y="315.1826">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" text