7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.6699" x="575.7202" y="114.792">CampusMarket</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="626.3301" y="131.0889">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.7441" x="521.1831" y="147.3857">Marketplace universitario para</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="269.1104" x="494" y="163.6826">publicar, consultar y buscar productos</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="28" id="ent0008"><path d="M445,195.2969 L445,492.8203 A0,0 0 0 0 445,492.8203 L811.5347,492.8203 A0,0 0 0 0 811.5347,492.8203 L811.5347,205.2969 L801.5347,195.2969 L632.5,195.2969 L628.5,176.9788 L624.5,195.2969 L445,195.2969 A0,0 0 0 0 445,195.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M801.5347,195.2969 L801.5347,205.2969 L811.5347,205.2969 L801.5347,195.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="160.7671" x="543.3838" y="212.3638">ALCANCE DEL NIVEL 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="621.7012" y="227.4966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.1641" x="504.6853" y="242.6294">Este diagrama muestra &#250;nicamente:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.7129" x="562.4109" y="257.7622">- actores externos;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.1909" x="520.6719" y="272.895">- CampusMarket como sistema;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.2729" x="519.6309" y="288.0278">- prop&#243;sito de las interacciones.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="621.7012" y="303.1606">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.7695" x="541.8826" y="318.2935">Fuera del alcance actual:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.4082" x="556.0632" y="333.4263">- pagos electr&#243;nicos;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.8154" x="538.3596" y="348.5591">- procesamiento bancario;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.4551" x="561.0398" y="363.6919">- env&#237;os y log&#237;stica;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.6724" x="511.9312" y="378.8247">- servicios externos de transporte.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="621.7012" y="393.9575">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.7612" x="485.8867" y="409.0903">Durante el desarrollo local se utiliza HTTP.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.5703" x="484.9822" y="424.2231">El acceso p&#250;blico observado utiliza HTTPS.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.5347" x="451" y="439.356">La universidad es declarada, no matr&#237;cula verificada.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="621.7012" y="454.4888">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.0596" x="492.2375" y="469.6216">Los contenedores y tecnolog&#237;as internas</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.5459" x="532.4944" y="484.7544">se detallan en el C4 Nivel 2.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk5"><polygon fill="#181818" points="483.9129,122.478,475.2714,117.7531,478.9298,122.0678,474.6151,125.7262,483.9129,122.478" style="stroke:#181818;stroke-width:1;"/><path d="M93.0872,90.3084 C170.3149,96.6652 347.5938,111.2573 477.9332,121.9858" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.4219" x="125" y="73.3638">Publica, consulta, guarda favoritos y conversa</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.9688" x="133.2266" y="88.4966">[Web / Android &#183; HTTP local, HTTPS p&#250;blico]</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk6"><polygon fill="#181818" points="483.8257,150.798,474.4616,147.7462,478.8523,151.313,475.2856,155.7037,483.8257,150.798" style="stroke:#181818;stroke-width:1;"/><path d="M105.101,178.6686 C175.9542,174.6892 311.729,166.5055 427,156.2969 C445.4,154.6673 458.762,153.3932 477.8576,151.416" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.041" x="144.9639" y="136.3638">Revisa reportes y modera publicaciones</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.9688" x="133.5" y="151.4966">[Web / Android &#183; HTTP local, HTTPS p&#250;blico]</text></g><g class="legend" data-source-line="20"><rect fill="#DDDDDD" height="79.1875" rx="