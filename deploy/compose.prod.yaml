services:
  api:
    image: ghcr.io/nnigarp/campusmarket-web-candidate@sha256:65d34f2de8d035d5a9672be2e6a81bab759089da2fbe91bdca23a17f2f0463fd
    restart: unless-stopped
    environment:
      CAMPUSMARKET_DB_HOST: db
      CAMPUSMARKET_DB_PORT: "3306"
      CAMPUSMARKET_DB_USER: ${MYSQL_USER:-campusmarket_app}
      CAMPUSMARKET_DB_PASSWORD: ${MYSQL_PASSWORD:?Introduce MYSQL_PASSWORD en Environment}
      CAMPUSMARKET_DB_NAME: ${MYSQL_DATABASE:-campusmarket}
      CAMPUSMARKET_DB_SSL: "false"
      CAMPUSMARKET_UPLOAD_DIR: /app/backend/uploads
      CAMPUSMARKET_ADMIN_USER_IDS: ${CAMPUSMARKET_ADMIN_USER_IDS:-}
      CAMPUSMARKET_CORS_ORIGINS: ${CAMPUSMARKET_CORS_ORIGINS:-}
    expose: ["8000"]
    volumes:
      - publication_images:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Introduce MYSQL_ROOT_PASSWORD en Environment}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusmarket}
      MYSQL_USER: ${MYSQL_USER:-campusmarket_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Introduce MYSQL_PASSWORD en Environment}
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=48M",
      "--innodb-log-buffer-size=4M", "--max-connections=30", "--table-open-cache=256",
      "--tmp-table-size=8M", "--max-heap-table-size=8M", "--skip-name-resolve"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" --batch --skip-column-names -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  mysql_data:
  publication_images:
