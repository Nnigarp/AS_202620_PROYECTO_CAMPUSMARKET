# Solo un NUEVO servicio Compose en campusmarket/development, Isolated Deployment.
# Nunca superponer sobre production: no hay recursos external ni nombres globales.
services:
  api:
    image: ghcr.io/nnigarp/campusmarket-web-candidate@sha256:65d34f2de8d035d5a9672be2e6a81bab759089da2fbe91bdca23a17f2f0463fd
    restart: unless-stopped
    labels:
      campusmarket.environment: development
      campusmarket.data: synthetic-only
    environment:
      CAMPUSMARKET_DB_HOST: db
      CAMPUSMARKET_DB_PORT: "3306"
      CAMPUSMARKET_DB_USER: campusmarket_dev
      CAMPUSMARKET_DB_PASSWORD: ${DEV_MYSQL_PASSWORD:?Introduce una clave NUEVA de development}
      CAMPUSMARKET_DB_NAME: campusmarket_development_test
      CAMPUSMARKET_DB_SSL: "false"
      CAMPUSMARKET_UPLOAD_DIR: /app/backend/uploads
      CAMPUSMARKET_ADMIN_USER_IDS: ""
      CAMPUSMARKET_CORS_ORIGINS: https://dev-campusmarket.iscoutb.dev
    expose: ["8000"]
    networks: [default, dev_data]
    volumes:
      - dev_publication_images:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  db:
    image: mysql:8.4
    restart: unless-stopped
    labels:
      campusmarket.environment: development
      campusmarket.data: synthetic-only
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD:?Introduce otra clave NUEVA de development}
      MYSQL_DATABASE: campusmarket_development_test
      MYSQL_USER: campusmarket_dev
      MYSQL_PASSWORD: ${DEV_MYSQL_PASSWORD:?Introduce una clave NUEVA de development}
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=48M",
      "--innodb-log-buffer-size=4M", "--max-connections=30", "--table-open-cache=256",
      "--tmp-table-size=8M", "--max-heap-table-size=8M", "--skip-name-resolve"]
    networks: [dev_data]
    volumes:
      - dev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" --batch --skip-column-names -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  default:
    labels:
      campusmarket.environment: development
  dev_data:
    internal: true
    labels:
      campusmarket.environment: development

volumes:
  dev_mysql_data:
    labels:
      campusmarket.environment: development
  dev_publication_images:
    labels:
      campusmarket.environment: development
