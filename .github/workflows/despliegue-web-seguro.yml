name: Mecanismo de despliegue Web seguro

on:
  push:
    branches: [ops/despliegue-web-digest-20261030]
    paths:
      - deploy/compose.*.yaml
      - scripts/preparar_despliegue_web.py
      - scripts/ensayar_despliegue_web.py
      - scripts/ensayar_imagen_ghcr.py
      - scripts/test_preparar_despliegue_web.py
      - .github/workflows/despliegue-web-seguro.yml
  pull_request:
    branches: [master]
    paths:
      - deploy/compose.*.yaml
      - scripts/preparar_despliegue_web.py
      - scripts/ensayar_despliegue_web.py
      - scripts/ensayar_imagen_ghcr.py
      - scripts/test_preparar_despliegue_web.py
      - .github/workflows/despliegue-web-seguro.yml
  workflow_dispatch:
    inputs:
      full_trial:
        description: "Repetir explícitamente el ensayo completo ya acreditado"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      runtime_changed: ${{ steps.scope.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determinar si cambiaron las operaciones del ensayo acreditado
        id: scope
        env:
          FULL_TRIAL: ${{ inputs.full_trial == true }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          baseline = "61a9171a6fff1ebfd53b869fc1b37aeb7d405461"
          paths = ["deploy", "scripts/ensayar_despliegue_web.py", "scripts/ensayar_imagen_ghcr.py"]
          result = subprocess.run(["git", "diff", "--exit-code", "--quiet", baseline, "HEAD", "--", *paths], check=False)
          assert result.returncode in (0, 1), "No se pudo contrastar la evidencia previa"
          changed = result.returncode == 1 or os.environ["FULL_TRIAL"] == "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("runtime_changed=" + str(changed).lower() + "\n")
          if not changed:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
                  stream.write("Operaciones Compose/ensayo sin cambios. Se conserva [run 41133683253](https://github.com/Nnigarp/AS_202620_PROYECTO_CAMPUSMARKET/actions/runs/41133683253); no se repite ni se descarga GHCR.\n")
          PY
      - name: Probar inventario selectivo y rechazo de planes alterados
        run: python3 -m unittest scripts.test_preparar_despliegue_web scripts.test_ensayar_imagen_ghcr -v

  mecanismo:
    needs: preflight
    if: needs.preflight.outputs.runtime_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Preparar Compose y credenciales exclusivamente sintéticas
        id: prepare
        run: |
          printf 'DOCKER_CONFIG=%s/campusmarket-ghcr-docker-%s-%s\n' \
            "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          python3 -m scripts.ensayar_despliegue_web prepare
      - name: Ensayar comandos reales de promoción y rollback sin build ni push
        run: python3 -m scripts.ensayar_despliegue_web run
      - name: Limpiar solamente recursos y credenciales del run
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: python3 -m scripts.ensayar_despliegue_web cleanup
      - name: Generar resultado sin Environment ni respaldos
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: python3 -m scripts.ensayar_despliegue_web report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        with:
          name: despliegue-web-seguro-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/despliegue-web-seguro/resultado.json
          if-no-files-found: error
          retention-days: 90
