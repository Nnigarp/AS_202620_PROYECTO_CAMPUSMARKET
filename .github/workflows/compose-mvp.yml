name: Compose y persistencia del MVP

on:
  push:
    branches: [master, mvp-autenticacion-producto, eval/s14-ec01-20261105]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    if: github.ref != 'refs/heads/eval/s14-ec01-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAMPUSMARKET_CI_PROJECT: campusmarket-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Resolver stack existente de verificación
        run: python -m pip install -r backend/requirements.txt
      - name: Credenciales efímeras fuera de Git y de artefactos
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "campusmarket-compose.env"
          content = {
              "MYSQL_ROOT_PASSWORD": secrets.token_hex(24),
              "MYSQL_PASSWORD": secrets.token_hex(24),
              "MYSQL_DATABASE": "campusmarket_compose_test",
              "MYSQL_USER": "campusmarket_app",
              "CAMPUSMARKET_ADMIN_USER_IDS": "3",
              "CAMPUSMARKET_REVISION": os.environ["GITHUB_SHA"],
          }
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w") as stream:
              stream.write("\n".join(key + "=" + value for key, value in content.items()) + "\n")
          PY
      - name: Construir y arrancar con cuota del laboratorio
        run: |
          docker compose --project-name "$CAMPUSMARKET_CI_PROJECT" --env-file "$RUNNER_TEMP/campusmarket-compose.env" -f deploy/compose.lab.yaml -f deploy/compose.local.yaml up -d --build --wait --wait-timeout 180
      - name: Cuatro contextos, EC-02, EC-01, memoria y recreación con volúmenes
        run: |
          python scripts/verificar_compose_mvp.py --project "$CAMPUSMARKET_CI_PROJECT" --env-file "$RUNNER_TEMP/campusmarket-compose.env" --revision "$GITHUB_SHA"
      - name: Verificar identidad de imagen probada
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(git rev-parse --verify HEAD)"
          test "$EXPECTED" = "$GITHUB_SHA"

          IMAGE_ID="$(docker compose \
            --project-name "$CAMPUSMARKET_CI_PROJECT" \
            --env-file "$RUNNER_TEMP/campusmarket-compose.env" \
            -f deploy/compose.lab.yaml \
            -f deploy/compose.local.yaml \
            images -q api)"

          test -n "$IMAGE_ID"

          OCI="$(docker image inspect "$IMAGE_ID" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"

          FILE="$(docker run --rm \
            --entrypoint cat "$IMAGE_ID" /app/REVISION)"

          test "$OCI" = "$EXPECTED"
          test "$FILE" = "$EXPECTED"

          echo "Imagen Compose verificada para SHA=$EXPECTED"
      - name: Verificar diff y ausencia de cambios en tracked files
        run: |
          git diff --check bfe3222c1e29dddc404560cdd9d61095d4bdb3fe HEAD
          git diff --exit-code
      - name: Exportar imagen Compose verificada
        if: github.repository == 'ISCOUTB/AS_202620_PROYECTO_CAMPUSMARKET' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker compose \
            --project-name "$CAMPUSMARKET_CI_PROJECT" \
            --env-file "$RUNNER_TEMP/campusmarket-compose.env" \
            -f deploy/compose.lab.yaml \
            -f deploy/compose.local.yaml \
            images -q api)"

          test -n "$IMAGE_ID"
          mkdir -p "$RUNNER_TEMP/campusmarket-release"
          docker save "$IMAGE_ID" -o "$RUNNER_TEMP/campusmarket-release/api.tar"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/campusmarket-release/source-sha.txt"

      - name: Conservar imagen verificada para publicacion posterior
        if: github.repository == 'ISCOUTB/AS_202620_PROYECTO_CAMPUSMARKET' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        uses: actions/upload-artifact@v4
        with:
          name: campusmarket-imagen-${{ github.sha }}
          path: ${{ runner.temp }}/campusmarket-release/
          retention-days: 7
          if-no-files-found: error
      - name: Logs de infraestructura sin valores de Environment
        if: always()
        run: |
          mkdir -p artifacts/compose
          docker compose --project-name "$CAMPUSMARKET_CI_PROJECT" --env-file "$RUNNER_TEMP/campusmarket-compose.env" -f deploy/compose.lab.yaml -f deploy/compose.local.yaml logs --no-color > artifacts/compose/contenedores.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-verificado-${{ github.sha }}
          path: artifacts/compose/
      - name: Limpiar únicamente proyecto efímero de CI
        if: always()
        run: |
          docker compose --project-name "$CAMPUSMARKET_CI_PROJECT" --env-file "$RUNNER_TEMP/campusmarket-compose.env" -f deploy/compose.lab.yaml -f deploy/compose.local.yaml down -v
          rm -f "$RUNNER_TEMP/campusmarket-compose.env"

  s14-ec01:
    if: github.ref == 'refs/heads/eval/s14-ec01-20261105' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'eval/s14-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Herramientas y controles del experimento, sin suites funcionales repetidas
        run: |
          python -m pip install -r backend/requirements-dev.txt playwright==1.56.0 ruff==0.16.9
          google-chrome --version
          ruff check scripts/medir_ec01_s14.py scripts/test_medir_ec01_s14.py
          python -m unittest scripts.test_medir_ec01_s14 -v
      - name: Reutilizar auditoría Gitleaks del historial acotado y checkout
        run: |
          cm_gitleaks_dir=$(mktemp -d "$RUNNER_TEMP/campusmarket-gitleaks.XXXXXX")
          trap 'rm -rf "$cm_gitleaks_dir"' EXIT
          curl --fail --location --retry 3 --output "$cm_gitleaks_dir/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$cm_gitleaks_dir/gitleaks.tar.gz" | sha256sum --check -
          tar --extract --gzip --file "$cm_gitleaks_dir/gitleaks.tar.gz" --directory "$cm_gitleaks_dir" gitleaks
          "$cm_gitleaks_dir/gitleaks" git . --redact --config .gitleaks.toml --log-opts="bfe3222c1e29dddc404560cdd9d61095d4bdb3fe..HEAD" --report-format json --report-path "$RUNNER_TEMP/campusmarket-secretos-historial.json"
          "$cm_gitleaks_dir/gitleaks" dir . --redact --config .gitleaks.toml --report-format json --report-path "$RUNNER_TEMP/campusmarket-secretos-checkout.json"

          mkdir -p artifacts/s14
          python - <<'PY_SUMMARY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          report = {'gitleaks': '8.30.1', 'history_range': 'bfe3222c1e29dddc404560cdd9d61095d4bdb3fe..HEAD', 'history_findings': len(json.loads((root/'campusmarket-secretos-historial.json').read_text())), 'checkout_findings': len(json.loads((root/'campusmarket-secretos-checkout.json').read_text())), 'entire_history_verified': False}
          Path('artifacts/s14/secretos.json').write_text(json.dumps(report, indent=2)+'\n')
          PY_SUMMARY
      - name: Distinguir medición nueva de actualización documental con código idéntico
        id: observacion
        shell: bash
        run: |
          python - <<'PY_REUSE'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          path = Path('docs/evidencias/datos/ec01-s14-2026-11-05.json')
          reuse = path.exists()
          if reuse:
              data = json.loads(path.read_text())
              sha = data['orchestration_sha']
              assert re.fullmatch(r'[0-9a-f]{40}', sha)
              assert data['execution_complete'] and len(data['http']['samples']) == len(data['browser']['samples']) == 10
              subprocess.run(['git', 'diff', '--exit-code', sha, 'HEAD', '--', 'scripts/medir_ec01_s14.py', 'scripts/test_medir_ec01_s14.py', '.github/workflows/compose-mvp.yml', 'deploy/compose.prod.yaml', 'backend/app', 'frontend/campusmarket/lib', 'contracts'], check=True)
              Path('artifacts/s14').mkdir(parents=True, exist_ok=True)
              Path('artifacts/s14/reutilizacion.json').write_text(json.dumps({'documentation_sha': os.environ['GITHUB_SHA'], 'measured_sha': sha, 'measured_run': data['run_id'], 'result_sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'same_experiment_and_functional_code': True, 'measurement_executed_now': False}, indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('reuse=' + str(reuse).lower(), file=output)
          PY_REUSE
      - name: Medir imagen inmutable y Chrome contra MySQL sintético bajo cuota
        if: steps.observacion.outputs.reuse != 'true'
        run: python scripts/medir_ec01_s14.py run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s14-ec01-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/s14/
          if-no-files-found: error
          retention-days: 90
      - name: Retirar exclusivamente el proyecto sintético de este run
        if: always()
        run: python scripts/medir_ec01_s14.py cleanup
