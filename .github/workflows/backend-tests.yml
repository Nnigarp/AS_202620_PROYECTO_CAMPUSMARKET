name: Pruebas del backend

on:
  push:
    branches:
      - master
      - feat/incremento-2-20261103
      - S3-esqueleto-ejecutable
      - S4-corte-vertical
      - S7-interfaces-contratos
      - S7-ajustes-finales-contrato
      - S7-api-mysql-c4
      - S8-despliegue-operacion
      - mvp-autenticacion-producto

  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: campusmarket_test
          MYSQL_USER: campusmarket_app
          MYSQL_PASSWORD: campusmarket_ci

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CAMPUSMARKET_DB_HOST: 127.0.0.1
      CAMPUSMARKET_DB_PORT: 3306
      CAMPUSMARKET_DB_USER: campusmarket_app
      CAMPUSMARKET_DB_PASSWORD: campusmarket_ci
      CAMPUSMARKET_DB_NAME: campusmarket_test

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Instalar Ruff
        run: python -m pip install ruff==0.16.9

      - name: Ejecutar análisis estático con Ruff
        run: python -m ruff check backend scripts

      - name: Auditar secretos del historial y checkout con Gitleaks
        run: |
          cm_gitleaks_dir=$(mktemp -d "$RUNNER_TEMP/campusmarket-gitleaks.XXXXXX")
          trap 'rm -rf "$cm_gitleaks_dir"' EXIT
          curl --fail --location --retry 3 --output "$cm_gitleaks_dir/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$cm_gitleaks_dir/gitleaks.tar.gz" | sha256sum --check -
          tar --extract --gzip --file "$cm_gitleaks_dir/gitleaks.tar.gz" --directory "$cm_gitleaks_dir" gitleaks
          "$cm_gitleaks_dir/gitleaks" git . --redact --config .gitleaks.toml --log-opts="bfe3222c1e29dddc404560cdd9d61095d4bdb3fe..HEAD" --report-format json --report-path "$RUNNER_TEMP/campusmarket-secretos-historial.json"
          "$cm_gitleaks_dir/gitleaks" dir . --redact --config .gitleaks.toml --report-format json --report-path "$RUNNER_TEMP/campusmarket-secretos-checkout.json"

      - name: Verificar conexión con MySQL
        run: |
          python - <<'PY'
          import os
          import pymysql

          conexion = pymysql.connect(
              host=os.environ["CAMPUSMARKET_DB_HOST"],
              port=int(os.environ["CAMPUSMARKET_DB_PORT"]),
              user=os.environ["CAMPUSMARKET_DB_USER"],
              password=os.environ["CAMPUSMARKET_DB_PASSWORD"],
              database=os.environ["CAMPUSMARKET_DB_NAME"],
              connect_timeout=5,
          )

          with conexion.cursor() as cursor:
              cursor.execute("SELECT 1")
              resultado = cursor.fetchone()

          conexion.close()

          assert resultado[0] == 1
          print("MySQL disponible para las pruebas")
          PY

      - name: Ejecutar pruebas funcionales y arquitectónicas
        run: >-
          python -m pytest backend/tests -q
          --ignore=backend/tests/test_contrato_openapi.py

      - name: Ejecutar prueba de contrato OpenAPI
        run: python -m pytest backend/tests/test_contrato_openapi.py -q

      - name: Verificar que las pruebas detectan defectos de seguridad y erosión
        run: python scripts/verificar_mutaciones_mvp.py

      - name: Verificar checkout limpio tras pruebas y mutaciones
        run: |
          git diff --check
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi
          printf 'CHECKOUT_CI_LIMPIO=%s\n' "$(git rev-parse HEAD)"

      - name: Conservar informes redactados del barrido de secretos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secretos-${{ github.sha }}
          path: ${{ runner.temp }}/campusmarket-secretos-*.json
