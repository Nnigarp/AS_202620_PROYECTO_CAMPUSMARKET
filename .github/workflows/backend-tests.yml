name: Pruebas del backend

on:
  push:
    branches:
      - master
      - S3-esqueleto-ejecutable
      - S4-corte-vertical
      - S7-interfaces-contratos
      - S7-ajustes-finales-contrato
      - S7-api-mysql-c4
      - S8-despliegue-operacion

  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: campusmarket
          MYSQL_USER: campusmarket_app
          MYSQL_PASSWORD: campusmarket_ci

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CAMPUSMARKET_DB_HOST: 127.0.0.1
      CAMPUSMARKET_DB_PORT: 3306
      CAMPUSMARKET_DB_USER: campusmarket_app
      CAMPUSMARKET_DB_PASSWORD: campusmarket_ci
      CAMPUSMARKET_DB_NAME: campusmarket

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r backend/requirements.txt

      - name: Instalar Ruff
        run: python -m pip install ruff==0.16.9

      - name: Ejecutar análisis estático con Ruff
        run: python -m ruff check backend/app backend/tests

      - name: Verificar conexión con MySQL
        run: |
          python - <<'PY'
          import os
          import pymysql

          conexion = pymysql.connect(
              host=os.environ["CAMPUSMARKET_DB_HOST"],
              port=int(os.environ["CAMPUSMARKET_DB_PORT"]),
              user=os.environ["CAMPUSMARKET_DB_USER"],
              password=os.environ["CAMPUSMARKET_DB_PASSWORD"],
              database=os.environ["CAMPUSMARKET_DB_NAME"],
              connect_timeout=5,
          )

          with conexion.cursor() as cursor:
              cursor.execute("SELECT 1")
              resultado = cursor.fetchone()

          conexion.close()

          assert resultado[0] == 1
          print("MySQL disponible para las pruebas")
          PY

      - name: Ejecutar pruebas funcionales y arquitectónicas
        run: >-
          python -m pytest backend/tests -q
          --ignore=backend/tests/test_contrato_openapi.py

      - name: Ejecutar prueba de contrato OpenAPI
        run: python -m pytest backend/tests/test_contrato_openapi.py -q
