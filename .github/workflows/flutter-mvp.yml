name: Validación Flutter MVP

on:
  push:
    branches: [master, mvp-autenticacion-producto, feat/incremento-2-20261103]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/campusmarket
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter oficial con versión fijada
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Resolver dependencias existentes
        run: flutter pub get
      - name: Registrar configuración pública resuelta por el SDK
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          print("CAMPUSMARKET_LOCK_SNAPSHOT=" + json.dumps({
              name: Path(name).read_text()
              for name in ["pubspec.lock", "analysis_options.yaml"]
          }))
          PY
      - name: Analizar Flutter
        run: flutter analyze
      - name: Pruebas de sesión, autorización y formularios
        run: flutter test
      - name: Comprobar detección de defectos del cliente
        run: python3 ../../scripts/verificar_mutaciones_flutter.py
      - name: Verificar diff del MVP
        run: git diff --check bfe3222c1e29dddc404560cdd9d61095d4bdb3fe HEAD
      - name: Compilar Web para verificación
        run: flutter build web --dart-define=CAMPUSMARKET_API_BASE_URL=http://127.0.0.1:8000
      - name: Compilar Android para verificación
        run: flutter build apk --debug
      - name: Registrar versión y hash verificados
        run: |
          git rev-parse HEAD > build/verificacion-hash.txt
          flutter --version >> build/verificacion-hash.txt
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          root = Path("../..").resolve()
          paths = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True, cwd=root
          ).splitlines()
          snapshot = {
              path: (root / path).read_text()
              for path in paths
              if Path(path).suffix in {".yaml", ".lock", ".dart", ".xml", ".kts", ".properties", ".cc", ".h", ".cmake", ".txt"}
          }
          print("CAMPUSMARKET_TOOLCHAIN_SNAPSHOT=" + json.dumps(snapshot))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-verificado-${{ github.sha }}
          path: |
            frontend/campusmarket/build/verificacion-hash.txt
            frontend/campusmarket/build/web/
            frontend/campusmarket/build/app/outputs/flutter-apk/app-debug.apk
